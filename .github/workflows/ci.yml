name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13", docker: "1" }
          - { os: windows-latest, python: "3.12" }
          - { os: macos-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[browser,dev,cloud]"
      - name: Install sandbox backends (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q bubblewrap firejail
          # Ubuntu 24.04 blocks unprivileged user namespaces by default; bubblewrap needs them.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Install Chromium (Linux)
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium
      - name: Install Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium
      - name: Lint
        if: runner.os == 'Linux'
        run: python -m pyflakes anvil tests
      - name: Tests
        env:
          ANVIL_TEST_DOCKER: ${{ matrix.docker }}
        run: python -m pytest -q -rs -p no:cacheprovider
      - name: Tests that need root (Caddy helper)
        if: runner.os == 'Linux'
        run: sudo -E env "PATH=$PATH" python -m pytest -q -p no:cacheprovider tests/test_scripts.py -k caddy
